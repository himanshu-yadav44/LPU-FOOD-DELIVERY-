<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LPU Food Delivery</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #fff8f0; }
    h1 { color: #d35400; }
    .card { background: white; padding: 20px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 20px; }
    button { background: #e67e22; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover { background: #d35400; }
  </style>
</head>
<body>
  <h1>🍔 LPU Food Delivery 🍕</h1>
  <p>Fresh & fast food delivered inside campus!</p>
  <div class="card">
    <h3>Veg Burger Combo</h3>
    <p>Price: ₹120</p>
    <button onclick="alert('Order Placed Successfully!')">Order Now</button>
  </div>
</body>
</html>
